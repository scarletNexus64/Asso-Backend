[unix_http_server]
file=/tmp/asso-supervisor.sock

[supervisord]
nodaemon=false
logfile=/home/asso/Asso-Backend/storage/logs/supervisord.log
pidfile=/tmp/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/asso-supervisor.sock

; ─── Laravel Web Server ───
[program:asso-serve]
command=php /home/asso/Asso-Backend/artisan serve --host=0.0.0.0 --port=8003
directory=/home/asso/Asso-Backend
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/home/asso/Asso-Backend/storage/logs/serve.log
stderr_logfile=/home/asso/Asso-Backend/storage/logs/serve-error.log
user=root

; ─── Laravel Scheduler ───
[program:asso-scheduler]
command=php /home/asso/Asso-Backend/artisan schedule:work
directory=/home/asso/Asso-Backend
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/home/asso/Asso-Backend/storage/logs/scheduler.log
stderr_logfile=/home/asso/Asso-Backend/storage/logs/scheduler-error.log
user=root

; ─── Default Queue Worker ───
[program:asso-queue-default]
command=php /home/asso/Asso-Backend/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/home/asso/Asso-Backend
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=30
stdout_logfile=/home/asso/Asso-Backend/storage/logs/queue-default.log
stderr_logfile=/home/asso/Asso-Backend/storage/logs/queue-default-error.log
user=root

; ─── Deposits/Withdrawals Queue Worker ───
[program:asso-queue-payments]
command=php /home/asso/Asso-Backend/artisan queue:work --queue=deposits,withdrawals,default --sleep=3 --tries=3 --max-time=3600
directory=/home/asso/Asso-Backend
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=30
stdout_logfile=/home/asso/Asso-Backend/storage/logs/queue-payments.log
stderr_logfile=/home/asso/Asso-Backend/storage/logs/queue-payments-error.log
user=root

; ─── Laravel Reverb (WebSocket) ───
[program:asso-reverb]
command=php /home/asso/Asso-Backend/artisan reverb:start --host=0.0.0.0 --port=8085
directory=/home/asso/Asso-Backend
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/home/asso/Asso-Backend/storage/logs/reverb.log
stderr_logfile=/home/asso/Asso-Backend/storage/logs/reverb-error.log
user=root

; ─── Group for easy management ───
[group:asso]
programs=asso-serve,asso-scheduler,asso-queue-default,asso-queue-payments,asso-reverb
